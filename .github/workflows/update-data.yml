name: Actualizar datos de mercado

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yfinance
        run: pip install yfinance --quiet

      - name: Fetch y guardar data.json
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import json, sys

          SYMBOLS = ['GGAL', 'GGAL.BA', '^GSPC', '^IXIC', '^DJI', '^MERV',
                     'BMA.BA', 'BBAR.BA', 'SUPV.BA']

          tickers = yf.Tickers(' '.join(SYMBOLS))
          results = []

          for sym in SYMBOLS:
              try:
                  info = tickers.tickers[sym].fast_info
                  hist = tickers.tickers[sym].history(period='1d', interval='1m')
                  last_price = float(info.last_price) if info.last_price else None
                  open_price = float(info.open)       if info.open       else last_price
                  prev_close = float(info.previous_close) if info.previous_close else open_price
                  volume     = int(info.shares)        if hasattr(info,'shares') and info.shares else 0

                  if last_price is None or last_price <= 0:
                      print(f'  {sym}: sin precio', file=sys.stderr)
                      continue

                  change     = last_price - prev_close
                  change_pct = (change / prev_close * 100) if prev_close else 0

                  results.append({
                      'symbol':                     sym,
                      'regularMarketPrice':         last_price,
                      'regularMarketChange':        change,
                      'regularMarketChangePercent': change_pct,
                      'regularMarketVolume':        volume,
                      'regularMarketOpen':          open_price,
                  })
                  print(f'  {sym}: {last_price}')
              except Exception as e:
                  print(f'  {sym}: ERROR {e}', file=sys.stderr)

          if not results:
              print('Sin resultados — abortando', file=sys.stderr)
              sys.exit(1)

          output = {'quoteResponse': {'result': results, 'error': None}}
          with open('data.json', 'w') as f:
              json.dump(output, f)

          print(f'OK: {len(results)}/{len(SYMBOLS)} símbolos')
          EOF

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u '+%H:%M UTC')"
          git push
