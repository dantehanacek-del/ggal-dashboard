name: Actualizar datos de mercado

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yfinance
        run: pip install yfinance --quiet

      - name: Fetch y guardar data.json
        run: |
          python3 << 'EOF'
          import yfinance as yf
          import json, sys

          SYMBOLS = ['GGAL', 'GGAL.BA', '^GSPC', '^IXIC', '^DJI', '^MERV',
                     'BMA.BA', 'BBAR.BA', 'SUPV.BA']

          results = []
          for sym in SYMBOLS:
              try:
                  hist = yf.Ticker(sym).history(period='2d')
                  if hist.empty:
                      print(f'  {sym}: vacío', file=sys.stderr)
                      continue
                  last  = hist.iloc[-1]
                  prev  = hist.iloc[-2] if len(hist) > 1 else last
                  price = float(last['Close'])
                  open_ = float(last['Open'])
                  vol   = int(last['Volume'])
                  chg   = price - float(prev['Close'])
                  pct   = chg / float(prev['Close']) * 100 if prev['Close'] else 0
                  results.append({
                      'symbol':                     sym,
                      'regularMarketPrice':         price,
                      'regularMarketChange':        round(chg, 4),
                      'regularMarketChangePercent': round(pct, 4),
                      'regularMarketVolume':        vol,
                      'regularMarketOpen':          open_,
                  })
                  print(f'  {sym}: {price}')
              except Exception as e:
                  print(f'  {sym}: {e}', file=sys.stderr)

          if not results:
              print('Sin resultados', file=sys.stderr)
              sys.exit(1)

          with open('data.json', 'w') as f:
              json.dump({'quoteResponse': {'result': results, 'error': None}}, f)
          print(f'OK: {len(results)}/{len(SYMBOLS)} símbolos')
          EOF

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u '+%H:%M UTC')"
          git push
