name: Update Market Data

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # también permite correrlo manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Yahoo Finance
        run: |
          curl -sf \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            "https://query1.finance.yahoo.com/v8/finance/quote?symbols=GGAL,GGAL.BA,%5EGSPC,%5EIXIC,%5EDJI,%5EMERV,BMA.BA,BBAR.BA,SUPV.BA" \
            -o data.json \
            || echo '{"quoteResponse":{"result":[],"error":"fetch failed"}}' > data.json

      - name: Commit if changed
        run: |
          git config user.name  "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: market data $(date -u '+%H:%M UTC') [skip ci]"
          git push
